<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>For You 🌸</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Great Vibes Font -->
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Floating Hearts (Generated by JS) -->

  <!-- Screen 1 -->
  <div class="screen fade-in" id="screen1">
    <div class="rose-3d" id="roseBtn">
      <div class="petal layer1"></div>
      <div class="petal layer2"></div>
      <div class="petal layer3"></div>
      <div class="petal layer4"></div>
      <div class="center"></div>
      <div class="stem"></div>
      <div class="leaf leaf1"></div>
      <div class="leaf leaf2"></div>
    </div>

    <p class="cute-text gv" id="cuteText">I wanted to give you a rose 💕</p>
    <button class="btn gv" id="takeBtn">Take it</button>
  </div>

  <!-- Screen 2 -->
  <div class="screen hidden" id="screen2">
    <h2 class="title slide-down gv">little note for you💌</h2>
    <div class="paper pop-in">
      <div class="paper-text gv" id="letterText"></div>
    </div>
    <button class="btn hidden gv" id="whoBtn">Who am I?</button>
  </div>

  <!-- Screen 3 -->
  <div class="screen hidden" id="screen3">
    <div class="final-box glow-in">
      <div class="final-text gv" id="finalTyping"></div>
      <div class="final-emojis">🏛️ 🏗️ 📐 🧱 ❤️</div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
